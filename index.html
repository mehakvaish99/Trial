<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Name — UX Designer</title>
  <style>
    :root {
      --bg: #faf9f6;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --accent: #4f46e5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --text: #f2f2f2;
        --muted: #a0a0a0;
        --accent: #818cf8;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px;
    }
    .eyebrow {
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(2.25rem, 7vw, 4.25rem);
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
    }
    p {
      color: var(--muted);
      font-size: 1.2rem;
      line-height: 1.6;
      max-width: 540px;
      margin-bottom: 32px;
    }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn {
      padding: 14px 24px;
      border-radius: 999px;
      font-weight: 600;
      text-decoration: none;
      border: 2px solid var(--accent);
    }
    .btn.primary { background: var(--accent); color: var(--bg); }
    .btn.secondary { color: var(--accent); }
    .btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  </style>
</head>
<body>
  <header class="hero">
    <span class="eyebrow">UX Designer</span>
    <h1>Hi, I'm Your Name. I design products people love to use.</h1>
    <p>I turn complex problems into simple, human-centered experiences through research, prototyping, and thoughtful design.</p>
    <div class="actions">
      <a class="btn primary" href="#work">View my work</a>
      <a class="btn secondary" href="#contact">Get in touch</a>
    </div>
  </header>
</body>
</html>
